<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vitruvian Options</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap');
*{box-sizing:border-box}body{margin:0;background:#f5f6f3;color:#202823;font-family:'DM Sans',sans-serif}main{max-width:1050px;margin:auto;padding:40px 24px}header{border-bottom:1px solid #dfe4dc;padding-bottom:24px}.brand{font-size:14px;font-weight:700;color:#38684e}h1{font-size:32px;letter-spacing:-1px;margin:28px 0 8px}p{color:#667169}.grid{display:grid;grid-template-columns:2fr 1fr;gap:24px;margin-top:30px}.card{background:#fff;border:1px solid #e0e6df;border-radius:14px;padding:24px}h2{font-size:19px;margin:0 0 20px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:16px}label{font-size:13px;color:#56625a;display:grid;gap:7px}input{font:inherit;padding:11px;border:1px solid #cfd8d0;border-radius:7px;width:100%}button{background:#245b3d;color:white;border:0;border-radius:7px;padding:12px 20px;font:inherit;font-weight:700;margin-top:22px;cursor:pointer}.value{font-size:42px;font-weight:700;color:#245b3d}.muted{font-size:13px;line-height:1.6}#message{color:#9c382e}@media(max-width:700px){.grid,.fields{grid-template-columns:1fr}}
</style></head><body><main><header><div class="brand">VITRUVIAN OPTIONS</div><h1>Minha posição na Aave</h1><p>Cadastre uma posição simulada e acompanhe seu health factor.</p></header><div class="grid"><section class="card"><h2>Dados da posição</h2><form id="position"><div class="fields" id="fields"></div><button>Salvar posição</button><p id="message" role="status"></p></form></section><aside class="card"><h2>Health factor</h2><div id="hf" class="value">—</div><p>Referência pessoal · 1,98 a 2,04</p><p id="detail" class="muted">Preencha os dados para calcular.</p></aside></div>
<section class="card" style="margin-top:24px"><h2>Cenário com vários ativos</h2>
<form id="scenario"><div class="fields"><label>Conta<input name="account" required></label><label>Rede<input name="network" required></label><label>Mercado Aave<input name="market" required></label></div><label>Preço BTC em USD<input name="btc_price" type="number" min="0.000001" step="any" required></label>
<h3>Garantias</h3><div id="collateral"></div><button type="button" id="add-collateral">Adicionar garantia</button>
<h3>Dívidas</h3><div id="debts"></div><button type="button" id="add-debt">Adicionar dívida</button>
<div><button type="submit">Calcular cenário</button> <button type="button" id="snapshot">Salvar cenário original</button></div>
<p id="scenario-message" role="status"></p></form><p id="scenario-current"></p><p id="scenario-original"></p></section>
<section class="card" style="margin-top:24px"><h2>Caixa simulado</h2>
<form id="funds"><div id="balances"></div><button type="button" id="add-balance">Adicionar saldo</button>
<label>BTC adicional no grid<input name="grid_btc" type="number" min="0" step="any" required value="0"></label><button>Salvar saldos</button></form>
<p id="funds-message" role="status"></p><div id="funds-result"></div>
<h3>Amortizar dívida na Aave</h3><form id="repay"><div class="fields"><label>Stablecoin<input name="token" required></label><label>Quantia<input name="amount" type="number" min="0.00000001" step="any" required></label></div><button>Simular amortização</button></form><p id="repay-message" role="status"></p></section></main>
<script>
const labels={account:'Conta',network:'Rede',market:'Mercado Aave',token:'Token de garantia',contract:'Contrato da garantia',quantity:'Quantidade da garantia',price:'Preço da garantia em USD',threshold:'Limiar de liquidação (%)',debt_token:'Stablecoin da dívida',debt_contract:'Contrato da stablecoin',debt_quantity:'Quantidade da dívida',debt_price:'Preço da stablecoin em USD',source:'Fonte dos dados',observed_at:'Data e hora da observação'};
const numeric=['quantity','price','threshold','debt_quantity','debt_price'];
const fields=document.querySelector('#fields');
for(const [key,label] of Object.entries(labels)){const item=document.createElement('label');item.textContent=label;const input=document.createElement('input');input.name=key;input.required=true;if(numeric.includes(key)){input.type='number';input.min='0';input.step='any'}if(key==='observed_at')input.type='datetime-local';item.append(input);fields.append(item)}
function render(data){if(!data)return;for(const key of Object.keys(labels))document.querySelector(`[name="${key}"]`).value=data[key];document.querySelector('#hf').textContent=data.health_factor===null?'Sem dívida':Number(data.health_factor).toFixed(2);document.querySelector('#detail').textContent=`Garantia: ${data.quantity} ${data.token} · US$ ${data.collateral_value}. Dívida: ${data.debt_quantity} ${data.debt_token}. Fonte: ${data.source} · ${data.observed_at}. Estimativa com dados informados.`}
fetch('/api/position').then(r=>r.json()).then(render);
document.querySelector('#position').addEventListener('submit',async e=>{e.preventDefault();const response=await fetch('/api/position',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});const data=await response.json();document.querySelector('#message').textContent=response.ok?'Posição salva.':data.error;if(response.ok)render(data)});

const definitions={collateral:{token:'Token',contract:'Contrato',quantity:'Quantidade',btc_ratio:'Token em BTC',threshold:'Limiar (%)'},debts:{token:'Stablecoin',contract:'Contrato',quantity:'Saldo com juros',price:'Preço em USD'}};
function addRow(kind,values={}){const row=document.createElement('div');row.className='fields';for(const [name,label] of Object.entries(definitions[kind])){const item=document.createElement('label');item.textContent=label;const input=document.createElement('input');input.name=name;input.required=true;if(name!=='token' && name!=='contract'){input.type='number';input.min='0';input.step='any'}input.value=values[name]||'';item.append(input);row.append(item)}const remove=document.createElement('button');remove.type='button';remove.textContent='Remover';remove.onclick=()=>row.remove();row.append(remove);document.querySelector('#'+kind).append(row)}
document.querySelector('#add-collateral').onclick=()=>addRow('collateral');
document.querySelector('#add-debt').onclick=()=>addRow('debts');
function scenarioData(snapshot){const form=document.querySelector('#scenario');const data={account:form.elements.account.value,network:form.elements.network.value,market:form.elements.market.value,btc_price:form.elements.btc_price.value,snapshot,observed_at:new Date().toISOString()};for(const kind of Object.keys(definitions)){data[kind]=[...document.querySelector('#'+kind).children].map(row=>Object.fromEntries([...row.querySelectorAll('input')].map(input=>[input.name,input.value])))}return data}
function showScenario(data){if(!data)return;const display=(item)=>{if(!item)return 'Nenhum cenário original salvo.';const result=item.result;return `HF: ${result.health_factor||'sem dívida'} · BTC em HF 1: ${result.liquidation_btc_price||'indisponível'} USD · ${item.input.observed_at} · Premissas: ${JSON.stringify(result.assumptions)} · Stablecoins: ${JSON.stringify(result.stablecoins)}`};document.querySelector('#scenario-current').textContent='Atual · '+display(data.current);document.querySelector('#scenario-original').textContent='Original · '+display(data.original)}
async function submitScenario(snapshot){const form=document.querySelector('#scenario');if(!form.reportValidity())return;const response=await fetch('/api/scenario',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(scenarioData(snapshot))});const data=await response.json();document.querySelector('#scenario-message').textContent=response.ok?'Cenário salvo.':data.error;if(response.ok)showScenario(data)}
document.querySelector('#scenario').onsubmit=e=>{e.preventDefault();submitScenario(false)};
document.querySelector('#snapshot').onclick=()=>submitScenario(true);
fetch('/api/scenario').then(r=>r.json()).then(data=>{if(data){for(const key of ['account','network','market','btc_price'])document.querySelector('#scenario').elements[key].value=data.current.input[key];for(const kind of Object.keys(definitions))data.current.input[kind].forEach(row=>addRow(kind,row));showScenario(data)}else{addRow('collateral');addRow('debts')}});

const balanceLabels={token:'Stablecoin',location:'Local (rede ou exchange)',total:'Saldo total',reserva:'Reserva para amortização',grid:'Grid',premios:'Prêmios',margem:'Margem',apostas:'Apostas'};
function addBalance(data={}){const row=document.createElement('div');row.className='fields';for(const [key,label] of Object.entries(balanceLabels)){const item=document.createElement('label');item.textContent=label;const input=document.createElement('input');input.name=key;input.required=true;if(key!=='token'&&key!=='location'){input.type='number';input.step='any';input.min='0';input.value=data[key]||'0'}else input.value=data[key]||'';item.append(input);row.append(item)}const remove=document.createElement('button');remove.type='button';remove.textContent='Remover';remove.onclick=()=>row.remove();row.append(remove);document.querySelector('#balances').append(row)}
document.querySelector('#add-balance').onclick=()=>addBalance();
function showFunds(data){if(!data)return;document.querySelector('#funds-result').textContent=data.balances.map(item=>`${item.token} em ${item.location}: livre ${item.available}; comprometido ${Number(item.total)-Number(item.available)}`).join(' · ')+` · BTC adicional no grid: ${data.grid_btc}`}
async function postData(url,data){const response=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});return [response,await response.json()]}
document.querySelector('#funds').onsubmit=async e=>{e.preventDefault();const balances=[...document.querySelector('#balances').children].map(row=>Object.fromEntries([...row.querySelectorAll('input')].map(input=>[input.name,input.value])));const [response,data]=await postData('/api/funds',{balances,grid_btc:e.target.elements.grid_btc.value});document.querySelector('#funds-message').textContent=response.ok?'Saldos salvos.':data.error;if(response.ok)showFunds(data)};
document.querySelector('#repay').onsubmit=async e=>{e.preventDefault();const form=document.querySelector('#scenario');const data=Object.fromEntries(new FormData(e.target));data.request_id=crypto.randomUUID();for(const key of ['account','network','market'])data[key]=form.elements[key].value;const [response,result]=await postData('/api/repay',data);document.querySelector('#repay-message').textContent=response.ok?'Amortização simulada.':result.error;if(response.ok){showFunds(result.funds);showScenario({current:result.scenario,original:null});location.reload()}};
fetch('/api/funds').then(r=>r.json()).then(data=>{if(data){data.balances.forEach(addBalance);document.querySelector('#funds').elements.grid_btc.value=data.grid_btc;showFunds(data)}else addBalance()});
</script></body></html>
