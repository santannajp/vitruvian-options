<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vitruvian Options</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap');
*{box-sizing:border-box}body{margin:0;background:#f5f6f3;color:#202823;font-family:'DM Sans',sans-serif}main{max-width:1050px;margin:auto;padding:40px 24px}header{border-bottom:1px solid #dfe4dc;padding-bottom:24px}.brand{font-size:14px;font-weight:700;color:#38684e}h1{font-size:32px;letter-spacing:-1px;margin:28px 0 8px}p{color:#667169}.grid{display:grid;grid-template-columns:2fr 1fr;gap:24px;margin-top:30px}.card{background:#fff;border:1px solid #e0e6df;border-radius:14px;padding:24px}h2{font-size:19px;margin:0 0 20px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:16px}label{font-size:13px;color:#56625a;display:grid;gap:7px}input{font:inherit;padding:11px;border:1px solid #cfd8d0;border-radius:7px;width:100%}button{background:#245b3d;color:white;border:0;border-radius:7px;padding:12px 20px;font:inherit;font-weight:700;margin-top:22px;cursor:pointer}.value{font-size:42px;font-weight:700;color:#245b3d}.muted{font-size:13px;line-height:1.6}#message{color:#9c382e}@media(max-width:700px){.grid,.fields{grid-template-columns:1fr}}
</style></head><body><main><header><div class="brand">VITRUVIAN OPTIONS</div><h1>Minha posição na Aave</h1><p>Cadastre uma posição simulada e acompanhe seu health factor.</p></header><div class="grid"><section class="card"><h2>Dados da posição</h2><form id="position"><div class="fields" id="fields"></div><button>Salvar posição</button><p id="message" role="status"></p></form></section><aside class="card"><h2>Health factor</h2><div id="hf" class="value">—</div><p>Referência pessoal · 1,98 a 2,04</p><p id="detail" class="muted">Preencha os dados para calcular.</p></aside></div></main>
<script>
const labels={account:'Conta',network:'Rede',market:'Mercado Aave',token:'Token de garantia',contract:'Contrato da garantia',quantity:'Quantidade da garantia',price:'Preço da garantia em USD',threshold:'Limiar de liquidação (%)',debt_token:'Stablecoin da dívida',debt_contract:'Contrato da stablecoin',debt_quantity:'Quantidade da dívida',debt_price:'Preço da stablecoin em USD',source:'Fonte dos dados',observed_at:'Data e hora da observação'};
const numeric=['quantity','price','threshold','debt_quantity','debt_price'];
const fields=document.querySelector('#fields');
for(const [key,label] of Object.entries(labels)){const item=document.createElement('label');item.textContent=label;const input=document.createElement('input');input.name=key;input.required=true;if(numeric.includes(key)){input.type='number';input.min='0';input.step='any'}if(key==='observed_at')input.type='datetime-local';item.append(input);fields.append(item)}
function render(data){if(!data)return;for(const key of Object.keys(labels))document.querySelector(`[name="${key}"]`).value=data[key];document.querySelector('#hf').textContent=data.health_factor===null?'Sem dívida':Number(data.health_factor).toFixed(2);document.querySelector('#detail').textContent=`Garantia: ${data.quantity} ${data.token} · US$ ${data.collateral_value}. Dívida: ${data.debt_quantity} ${data.debt_token}. Fonte: ${data.source} · ${data.observed_at}. Estimativa com dados informados.`}
fetch('/api/position').then(r=>r.json()).then(render);
document.querySelector('#position').addEventListener('submit',async e=>{e.preventDefault();const response=await fetch('/api/position',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});const data=await response.json();document.querySelector('#message').textContent=response.ok?'Posição salva.':data.error;if(response.ok)render(data)});
</script></body></html>
